name: Dependency Review

on:
  pull_request:

permissions:
  contents: read

jobs:
  # Required by the auto-merge bot: a PR that adds or upgrades to a
  # dependency with a known vulnerability (GitHub Advisory Database) fails
  # here and is never auto-merged.
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    steps:
      - name: Review dependency changes for known vulnerabilities
        uses: actions/dependency-review-action@v5
        with:
          vulnerability-check: true
          license-check: false
          comment-summary-in-pr: never

  # Informational (not a merge gate): several existing transitive deps use
  # licenses outside the allow-list (MPL-2.0 lightningcss via Vite,
  # BlueOak-1.0.0, CC-BY-4.0 caniuse-lite), so gating on it would block
  # routine Dependabot updates. Widen the allow-list before making it
  # required.
  license-review:
    name: License review
    runs-on: ubuntu-latest
    steps:
      # The action reads config-file from the workspace, so the repo must be
      # checked out first (without this every run failed with ENOENT).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Review dependency licenses
        uses: actions/dependency-review-action@v5
        with:
          config-file: ./.github/dependency-review-config.yml
          license-check: true
          vulnerability-check: false
