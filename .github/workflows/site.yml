name: site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/site.yml"

# Explicit least-privilege token, not relying on the repo/org default
# (currently "read" too, checked directly -- but shouldn't depend on
# that staying true). Nothing here pushes, comments, or writes
# anything -- checkout, typecheck, lint, build all only need read
# access.
permissions:
  contents: read

jobs:
  build:
    name: Site / typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Node 20 is deprecated on GitHub Actions (see coop-pwa.yml/
          # buyer-app.yml, which hit a hard jsdom-engines incompatibility
          # on it) -- bumped here too for consistency, even though this
          # job doesn't run jsdom-based tests itself.
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: npm ci
        run: npm ci

      # Fails the job on a high or critical advisory in anything npm ci just
      # installed (runtime and dev dependencies alike). Moderate and low
      # advisories do not fail the build. Kept inside this job so the
      # required check name is unchanged.
      - name: npm audit (fail on high or critical)
        run: npm audit --audit-level=high


      - name: typecheck
        run: npx tsc -b --noEmit

      - name: lint
        run: npm run lint

      - name: build
        run: npm run build
